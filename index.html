<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Caisse 2.0 — Système de caisse POS moderne">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caisse 2.0">

    <title>Caisse 2.0</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/print.css" media="print">

    <!-- Firebase SDK v10 (loaded in app.js to guarantee ordering) -->

    <!-- ZXing browser barcode scanner -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
</head>
<body>
    <!-- App Root -->
    <div id="app">
        <!-- Splash screen shown while loading -->
        <div id="splash" class="splash-screen">
            <div class="splash-content">
                <div class="splash-icon">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3b82f6"/>
                                <stop offset="100%" style="stop-color:#8b5cf6"/>
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="20" height="20" rx="3"/>
                        <line x1="2" y1="10" x2="22" y2="10"/>
                        <line x1="12" y1="2" x2="12" y2="10"/>
                        <path d="M7 15h0.01M12 15h0.01M17 15h0.01M7 19h0.01M12 19h0.01M17 19h0.01"/>
                    </svg>
                </div>
                <h1 class="splash-title">Caisse 2.0</h1>
                <p class="splash-subtitle">Système de caisse intelligent</p>
                <div class="splash-loader">
                    <div class="splash-loader-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
